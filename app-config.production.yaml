app:
  # The public URL of your Backstage instance (Using your nip.io static IP)
  baseUrl: http://backstage.34.136.31.203.nip.io

backend:
  baseUrl: http://backstage.34.136.31.203.nip.io
  listen:
    port: 7007
  
  # Database connection using the Cloud SQL Postgres URL
  database:
    client: pg
    connection:
      $env: POSTGRES_URL

  # Allow connections from the ingress
  cors:
    origin: http://backstage.34.136.31.203.nip.io

auth:
  environment: production
  providers:
    github:
      production:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
